<!DOCTYPE html>
<html>

<head>

<title>Project Cargo Tracking Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Segoe UI, Arial;
background:#0e1116;
color:white;
}

.header{
background:#111827;
padding:18px;
font-size:22px;
font-weight:600;
}

.container{
display:flex;
height:92vh;
}

#map{
flex:3;
}

.sidebar{
flex:1;
background:#161b22;
overflow-y:auto;
padding:15px;
border-left:1px solid #2d3748;
}

.shipment{
padding:12px;
margin-bottom:10px;
background:#1f2937;
border-radius:6px;
}

.shipment h3{
margin:0;
font-size:16px;
}

.status{
color:#4ade80;
font-size:12px;
}

</style>

</head>

<body>

<div class="header">
🌍 Project Logistics Dashboard – Live Vessel Tracking
</div>

<div class="container">

<div id="map"></div>

<div class="sidebar" id="shipmentList"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([20,10],2);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
maxZoom:19
}).addTo(map);

var vesselsToTrack = [
"MSC OSCAR",
"CMA CGM GUARANI",
"MSC JOHANNESBURG",
"BRISBANE MAERSK",
"MXD XIAMEN"
];

var markers = {};

/* Connect to AIS Stream */

const socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

socket.onopen = function(){

let subscription = {

APIKey: "YOUR_AISSTREAM_API_KEY",

BoundingBoxes: [[[-90,-180],[90,180]]]

};

socket.send(JSON.stringify(subscription));

};


/* Receive Vessel Positions */

socket.onmessage = function(event){

let data = JSON.parse(event.data);

if(data.MessageType === "PositionReport"){

let vessel = data.MetaData.ShipName;

if(vesselsToTrack.includes(vessel)){

let lat = data.Message.PositionReport.Latitude;
let lon = data.Message.PositionReport.Longitude;

if(markers[vessel]){

markers[vessel].setLatLng([lat,lon]);

}else{

markers[vessel] = L.circleMarker([lat,lon],{
radius:8,
color:"#22c55e"
}).addTo(map);

markers[vessel].bindPopup("<b>"+vessel+"</b>");

}

}

}

};

</script>
</body>

</html>
